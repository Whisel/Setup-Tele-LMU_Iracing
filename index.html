<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup and Telemetry for iRacing and Le Mans Ultimate</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Setup and Telemetry</span>
    <span class="brand-sub">iRacing and Le Mans Ultimate</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="top-tools">
    <label class="mini">Speed in
      <select id="unit-speed"><option value="kmh">km/h</option><option value="mph">mph</option></select>
    </label>
    <button class="btn ghost" id="theme-toggle" type="button">Light theme</button>
  </div>
</header>

<div class="layout">
  <aside class="rail" aria-label="Sessions and laps">
    <section class="drop" id="drop">
      <p class="drop-title">Add telemetry or setup files</p>
      <p class="drop-help">Drop files here. iRacing <code>.ibt</code>, Le Mans Ultimate <code>.duckdb</code> and <code>.svm</code>, or a library export.</p>
      <div class="drop-actions">
        <button class="btn" id="pick-files" type="button">Choose files</button>
        <button class="btn ghost" id="pick-folder" type="button" title="Reads setups from every .svm and .ibt file in a folder, without loading the telemetry">Scan a folder for setups</button>
      </div>
      <input type="file" id="file-input" multiple hidden accept=".ibt,.duckdb,.svm,.json">
      <input type="file" id="folder-input" webkitdirectory multiple hidden>
    </section>
    <div id="busy" class="busy" hidden></div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <section class="rail-block">
      <h2>Sessions</h2>
      <div id="session-list" class="session-list"></div>
    </section>
    <section class="rail-block grow">
      <h2>Laps <span id="laps-of" class="h-note"></span></h2>
      <div id="lap-list" class="lap-list"></div>
    </section>
  </aside>

  <main>
    <section class="lapbar" id="lapbar" aria-label="Laps being compared"></section>
    <div id="view" class="view"></div>
  </main>
</div>

<script src="js/core/util.js"></script>
<script src="js/io/yaml-lite.js"></script>
<script src="js/io/ibt.js"></script>
<script src="js/io/lmu.js"></script>
<script src="js/data/car-limits.js"></script>
<script src="js/model/setup.js"></script>
<script src="js/model/session.js"></script>
<script src="js/analysis/handling.js"></script>
<script src="js/analysis/advisor.js"></script>
<script src="js/analysis/technique.js"></script>
<script src="js/analysis/learning.js"></script>
<script src="js/analysis/baseline.js"></script>
<script src="js/store/library.js"></script>
<script src="js/ui/duck.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/views.js"></script>
<script>STA.app.start();</script>
</body>
</html>
